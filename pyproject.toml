[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name        = "kairodristi"
version     = "1.0.0"
description = "Offline aerial intelligence for search and rescue"
readme      = "README.md"
requires-python = ">=3.10"
license     = { text = "Proprietary" }
authors     = [{ name = "KairoDrishti" }]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov"]

[project.scripts]
aegis-sar-demo = "run_sar_demo:main"
kairodristi-dashboard = "app.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "engine*", "tests*"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
addopts      = "-v --tb=short"

[tool.coverage.run]
source  = ["engine"]
omit    = ["tests/*", "interfaces/*", "deploy/*"]
